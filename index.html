<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wichtelo-Mat</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #990000;
            --dark-red: #4a0000;
            --gold: #d4af37;
            --paper-bg: #fffbf0;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Schneeflocken Animation */
        .snowflake {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(105vh) translateX(20px); }
        }

        .container {
            background-color: var(--paper-bg);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 520px;
            padding: 40px 30px 30px 30px;
            box-sizing: border-box;
            position: relative;
            /* Zuckerstangen / Airmail-Rahmenmuster */
            border: 16px solid transparent;
            border-image: repeating-linear-gradient(45deg, #990000, #990000 20px, #ffffff 20px, #ffffff 40px) 16;
            text-align: left;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            color: var(--primary-red);
            margin: 0 0 5px 0;
            font-size: 2.8rem;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-family: 'Caveat', cursive;
            color: #666;
            font-size: 1.4rem;
            margin-bottom: 25px;
        }

        .phase-badge {
            font-family: 'Caveat', cursive;
            background-color: var(--primary-red);
            color: white;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #444;
        }

        select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #d4c5b9;
            background-color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            height: 90px;
            background-image: linear-gradient(to bottom, transparent 31px, #f0e6d6 31px);
            background-size: 100% 32px;
            line-height: 32px;
            padding-top: 2px;
        }

        button {
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }

        button:hover:not(:disabled) {
            background-color: var(--dark-red);
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .status-box {
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
